# Custom ByteTrack configuration with 3-second (90 frames) track persistence buffer
tracker_type: bytetrack
track_high_thresh: 0.20
track_low_thresh: 0.05
new_track_thresh: 0.20
track_buffer: 90 # 3 full seconds at 30 FPS (retains same track_id during temporary occlusion/missed detections)
match_thresh: 0.8
fuse_score: True
